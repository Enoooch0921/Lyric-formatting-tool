<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教會歌詞排版助手 Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5; /* Indigo 600 */
            --primary-hover: #4338ca;
            --secondary: #64748b; /* Slate 500 */
            --success: #10b981; /* Emerald 500 */
            --danger: #ef4444; /* Red 500 */
            --bg-color: #f1f5f9; /* Slate 100 */
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--secondary);
            font-size: 1rem;
            margin-top: 8px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        /* Controls Area */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .controls-grid {
                grid-template-columns: auto 1fr auto; /* 左設定 中工具 右危險區 */
                align-items: center;
            }
        }

        .control-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .group-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 8px;
        }

        /* Inputs */
        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input[type="number"] {
            border: none;
            background: transparent;
            width: 50px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            outline: none;
        }

        /* Buttons */
        button {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
            transform: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover { background-color: var(--primary-hover); box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.4); transform: translateY(-1px); }

        .btn-outline {
            background-color: white;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-outline:hover { background-color: var(--bg-color); border-color: #cbd5e1; }

        .btn-soft {
            background-color: #e0e7ff; /* Indigo 100 */
            color: var(--primary);
        }
        .btn-soft:hover { background-color: #c7d2fe; }

        .btn-danger-ghost {
            background: transparent;
            color: var(--danger);
            border: 1px solid transparent;
        }
        .btn-danger-ghost:hover { background: #fef2f2; border-color: #fecaca; }

        /* Translation Tools Bar */
        .tools-bar {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Lyric file import */
        .ppt-import-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 14px;
        }

        .ppt-import-title {
            margin: 0;
            font-size: 1.05rem;
        }

        .ppt-import-helper {
            margin: 4px 0 0;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .ppt-import-header {
                flex-direction: column;
                gap: 8px;
            }
        }

        .privacy-note {
            color: var(--success);
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .ppt-drop-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 82px;
            padding: 16px;
            border: 2px dashed #a5b4fc;
            border-radius: 10px;
            background: #eef2ff;
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .ppt-drop-zone:hover,
        .ppt-drop-zone:focus-within,
        .ppt-drop-zone.is-dragging {
            border-color: var(--primary);
            background: #e0e7ff;
        }

        .ppt-drop-zone.is-loading {
            cursor: wait;
            opacity: 0.65;
        }

        #pptInput {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        .ppt-status {
            min-height: 1.5em;
            margin-top: 10px;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .ppt-status.is-error {
            color: var(--danger);
        }

        .song-choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .song-choice {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #f8fafc;
        }

        .song-choice-title {
            font-weight: 700;
        }

        .song-choice-meta {
            color: var(--secondary);
            font-size: 0.82rem;
        }

        .song-choice-preview {
            white-space: pre-line;
            overflow-wrap: anywhere;
            font-size: 0.9rem;
        }

        .song-choice > details, .song-choice > label { width: 100%; min-width: 0; }
        .song-choice summary { cursor: pointer; font-size: 0.9rem; padding: 4px 0; }
        .song-choice select {
            display: block;
            width: 100%;
            margin-top: 4px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: white;
            font: inherit;
        }
        .song-choice textarea {
            display: block;
            box-sizing: border-box;
            width: 100%;
            height: 180px;
            margin: 8px 0;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            background: white;
        }
        .song-rule-notice { margin: 0; overflow-wrap: anywhere; }

        .import-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        [hidden] { display: none !important; }

        .song-choice button {
            margin-top: auto;
        }

        /* Editor Area */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            height: 60vh;
        }

        @media (min-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .editor-box {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden; /* For header rounded corners */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .editor-header {
            background: #f8fafc;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-weight: 700;
            color: var(--secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            flex: 1;
            padding: 20px;
            border: none;
            resize: none;
            font-size: 16px;
            line-height: 1.7;
            font-family: inherit;
            color: var(--text-main);
        }

        textarea:focus {
            outline: none;
            background-color: #fafafa;
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        /* Output specific styles */
        #outputLyrics {
            background-color: #f8fafc;
        }

        .btn-copy {
            background-color: var(--success);
            color: white;
            font-size: 0.85rem;
            padding: 6px 12px;
        }
        .btn-copy:hover { background-color: #059669; }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>教會歌詞排版助手 Pro</h1>
            <div class="subtitle">智慧防孤兒字・自動標段・翻譯管理・不切斷詞彙</div>
        </header>

        <section class="card" aria-labelledby="pptImportTitle">
            <div class="ppt-import-header">
                <div>
                    <h2 id="pptImportTitle" class="ppt-import-title">匯入歌詞檔案</h2>
                    <p class="ppt-import-helper">拖入 PPT、PPTX 或 Word DOCX，辨識歌曲並整理段落，再選擇要匯入哪一首。</p>
                </div>
                <span class="privacy-note">🔒 僅在瀏覽器內解析</span>
            </div>
            <label id="pptDropZone" class="ppt-drop-zone" for="pptInput">
                <span id="pptDropText">將 PPT／PPTX／DOCX 拖到這裡，或點擊選擇檔案（最多 50 MB）</span>
                <input id="pptInput" type="file" aria-label="選擇 PPT、PPTX 或 DOCX 歌詞檔案" accept=".ppt,.pptx,.docx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
            </label>
            <div id="pptStatus" class="ppt-status" role="status" aria-live="polite"></div>
            <p id="fileWarnings" class="ppt-import-helper" hidden></p>
            <div id="songChoices" class="song-choices" hidden></div>
            <div id="importActions" class="import-actions" hidden>
                <button id="importAllBtn" class="btn-outline" type="button" onclick="importAllSongs()">匯入全部（含歌名分隔）</button>
                <button id="importOriginalBtn" class="btn-outline" type="button" onclick="importOriginalDocument()" hidden>分歌不正確？匯入整份原文</button>
            </div>
        </section>

        <div class="card">
            <div class="controls-grid">
                <div class="control-group">
                    <div class="input-wrapper" title="每行字數參考（中文=2，英文=1）">
                        <span style="font-size: 0.9rem; color: var(--secondary); margin-right:5px;">行寬限制</span>
                        <input type="number" id="charLimit" value="13" min="5" max="40">
                    </div>
                </div>

                <div class="control-group" style="justify-content: center;">
                    <button class="btn-primary" onclick="formatLyrics()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        一鍵格式化
                    </button>
                    <button class="btn-outline" onclick="replaceText('你', '祢')">你 → 祢</button>
                    <button class="btn-outline" onclick="replaceText('他', '祂')">他 → 祂</button>
                </div>

                <div class="control-group" style="justify-content: flex-end;">
                    <button class="btn-danger-ghost" onclick="clearAll()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        清空
                    </button>
                </div>
            </div>

            <div class="tools-bar">
                <span class="group-label">翻譯管理工具</span>
                <button class="btn-soft" onclick="keepChineseOnly()" title="保留中文">
                    🇨🇳 只留中文
                </button>
                <button class="btn-soft" onclick="keepEnglishOnly()" title="保留英文">
                    🇺🇸 只留英文
                </button>
                <button class="btn-soft" onclick="keepOddLines()" title="去除雙語歌詞中的翻譯行">
                    🔢 移除雙數行
                </button>
                <button id="undoBtn" class="btn-outline" onclick="undoLastChange()" disabled title="復原最近一次輸入變更">
                    ↶ 復原上一步
                </button>
            </div>
        </div>

        <div class="editor-container">
            <div class="editor-box">
                <div class="editor-header">
                    <span class="editor-title">原始歌詞</span>
                </div>
                <textarea id="inputLyrics" placeholder="請在此貼上歌詞...&#10;&#10;💡 功能提示：&#10;1. 防孤兒字：末尾單字若超出一點點，會自動擠在同一行&#10;2. 自動標段：輸入 V1, C, B, Pre 自動識別&#10;3. 智慧糾錯：修正 Pro Chorus, Brisge 等拼寫錯誤"></textarea>
            </div>

            <div class="editor-box">
                <div class="editor-header">
                    <span class="editor-title">排版結果</span>
                    <button id="copyBtn" class="btn-copy" onclick="copyToClipboard()">
                        📋 複製結果
                    </button>
                </div>
                <textarea id="outputLyrics" readonly placeholder="格式化後的結果將顯示於此..."></textarea>
            </div>
        </div>
    </div>

    <script src="vendor/fflate-0.8.2.min.js"></script>
    <script src="pptx-importer.js"></script>
    <script src="vendor/cfb-1.2.2.min.js"></script>
    <script src="ppt-importer.js"></script>
    <script src="lyric-formatter.js"></script>
    <script src="docx-importer.js"></script>
    <script src="slide-sections.js?v=20261011-2"></script>
    <script>
        const inputHistory = [];
        let detectedSongs = [];
        let isFileParsing = false;
        let originalDocumentText = '';

        const pptInput = document.getElementById('pptInput');
        const pptDropZone = document.getElementById('pptDropZone');
        const pptDropText = document.getElementById('pptDropText');
        const pptStatus = document.getElementById('pptStatus');
        const songChoices = document.getElementById('songChoices');
        const importActions = document.getElementById('importActions');
        const fileWarnings = document.getElementById('fileWarnings');

        function songOrdinal(index) {
            return ['第一首', '第二首', '第三首', '第四首', '第五首', '第六首'][index] || `第 ${index + 1} 首`;
        }

        function setPptStatus(message, isError = false) {
            pptStatus.textContent = message;
            pptStatus.classList.toggle('is-error', isError);
        }

        function renderSongChoices() {
            songChoices.replaceChildren();
            detectedSongs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'song-choice';

                const title = document.createElement('div');
                title.className = 'song-choice-title';
                title.textContent = `${songOrdinal(index)}｜${song.title || song.preview.split('\n')[0].slice(0, 24)}`;

                const meta = document.createElement('div');
                meta.className = 'song-choice-meta';
                meta.textContent = `${song.sourceDescription}・${song.result.sections.length} 個段落`;

                const preview = document.createElement('div');
                preview.className = 'song-choice-preview';
                preview.textContent = song.preview;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn-primary';
                button.textContent = `匯入${songOrdinal(index)}`;
                button.addEventListener('click', () => importDetectedSong(index));

                card.append(title, meta, preview, button);
                if (song.contentSlides) {
                    song.importOptions = { pagesPerSection: 'auto', referenceText: '' };
                    const ruleLabel = document.createElement('label');
                    ruleLabel.textContent = '段落規則';
                    const ruleSelect = document.createElement('select');
                    ruleSelect.setAttribute('aria-label', `${songOrdinal(index)}段落規則`);
                    [['auto', '自動（無可靠界線時保留為一段）'], ['1', '每 1 個歌詞頁一段'],
                        ['2', '每 2 個歌詞頁合成一段'], ['3', '每 3 個歌詞頁合成一段'],
                        ['4', '每 4 個歌詞頁合成一段']].forEach(([value, text]) => {
                        const option = document.createElement('option');
                        option.value = value;
                        option.textContent = text;
                        ruleSelect.append(option);
                    });
                    ruleLabel.append(ruleSelect);
                    const ruleHelp = document.createElement('p');
                    ruleHelp.className = 'ppt-import-helper';
                    ruleHelp.textContent = '不需參考歌詞也能設定分段。匯出主歌一律從 [1] 連續編號，不跳號；原版缺段只顯示提醒，不補入歌詞。';

                    const referenceDetails = document.createElement('details');
                    const referenceSummary = document.createElement('summary');
                    referenceSummary.textContent = '貼入參考歌詞，比對段落與缺漏（選填）';
                    const referenceInput = document.createElement('textarea');
                    referenceInput.setAttribute('aria-label', `${songOrdinal(index)}參考歌詞`);
                    referenceInput.maxLength = 20000;
                    referenceInput.placeholder = '請只貼入這一首歌，保留編號，例如：\n1.\n第一段歌詞\n\n2.\n第二段歌詞';
                    const referenceHelp = document.createElement('p');
                    referenceHelp.className = 'ppt-import-helper';
                    referenceHelp.textContent = '參考歌詞為選填，用於輔助分段及提醒缺漏。匯出主歌仍連續編號，參考原編號只顯示在提示。字詞差異不改原文、不補歌詞。清空後再套用可取消比對。';
                    const applyReference = document.createElement('button');
                    applyReference.type = 'button';
                    applyReference.className = 'btn-outline';
                    applyReference.textContent = '套用參考歌詞';
                    referenceDetails.append(referenceSummary, referenceInput, referenceHelp, applyReference);

                    const sectionDetails = document.createElement('details');
                    sectionDetails.open = true;
                    const sectionSummary = document.createElement('summary');
                    sectionSummary.textContent = '段落預覽（確認後再匯入）';
                    const sectionLabels = document.createElement('p');
                    sectionLabels.className = 'song-choice-meta song-rule-notice';
                    const sectionPreview = document.createElement('textarea');
                    sectionPreview.readOnly = true;
                    sectionPreview.setAttribute('aria-label', `${songOrdinal(index)}段落預覽`);
                    sectionDetails.append(sectionSummary, sectionLabels, sectionPreview);
                    const notice = document.createElement('p');
                    notice.className = 'ppt-import-helper song-rule-notice';
                    notice.setAttribute('role', 'status');
                    const errorNotice = document.createElement('p');
                    errorNotice.className = 'ppt-status is-error song-rule-notice';
                    errorNotice.setAttribute('role', 'alert');
                    errorNotice.hidden = true;
                    const updatePreview = nextOptions => {
                        try {
                            const result = SlideSections.consolidateSlides(song.contentSlides, nextOptions);
                            song.importOptions = nextOptions;
                            song.result = result;
                            sectionPreview.value = result.text;
                            sectionLabels.textContent = `段落標記：${result.sections.map(item => item.label).join('、')}`;
                            meta.textContent = `${song.sourceDescription}・${result.sections.length} 個段落`;
                            notice.textContent = result.warnings.join(' ');
                            errorNotice.hidden = true;
                        } catch (error) {
                            errorNotice.textContent = `${error.message} 目前預覽未變更。`;
                            errorNotice.hidden = false;
                            ruleSelect.value = song.importOptions.pagesPerSection;
                        }
                    };
                    ruleSelect.addEventListener('change', () => updatePreview({ ...song.importOptions, pagesPerSection: ruleSelect.value }));
                    applyReference.addEventListener('click', () => updatePreview({ ...song.importOptions, referenceText: referenceInput.value }));
                    card.insertBefore(ruleLabel, button);
                    card.insertBefore(ruleHelp, button);
                    card.insertBefore(referenceDetails, button);
                    card.insertBefore(sectionDetails, button);
                    card.insertBefore(notice, button);
                    card.insertBefore(errorNotice, button);
                    updatePreview(song.importOptions);
                }
                songChoices.append(card);
            });
            songChoices.hidden = false;
            document.getElementById('importAllBtn').hidden = detectedSongs.length < 2;
            document.getElementById('importOriginalBtn').hidden = !originalDocumentText;
            importActions.hidden = detectedSongs.length < 2 && !originalDocumentText;
        }

        async function handleLyricFile(file) {
            if (!file || isFileParsing) return;

            isFileParsing = true;
            detectedSongs = [];
            originalDocumentText = '';
            pptDropZone.classList.add('is-loading');
            pptDropZone.setAttribute('aria-busy', 'true');
            pptInput.disabled = true;
            pptDropText.textContent = `正在解析 ${file.name}…`;
            songChoices.hidden = true;
            songChoices.replaceChildren();
            importActions.hidden = true;
            fileWarnings.hidden = true;
            setPptStatus('正在讀取歌詞與段落…');

            try {
                let source;
                if (/\.docx$/i.test(file.name)) {
                    const document = await DocxLyricImporter.parseDocxFile(file);
                    originalDocumentText = document.paragraphs.map(paragraph => paragraph.lines.join('\n')).join('\n').trim();
                    detectedSongs = DocxLyricImporter.detectSongs(document.paragraphs).map(song => ({
                        ...song,
                        sourceDescription: `Word 文字段 ${song.startParagraph}–${song.endParagraph}`,
                        result: DocxLyricImporter.consolidateSong(song.paragraphs)
                    }));
                    source = 'Word 文件';
                    fileWarnings.textContent = ['請核對歌名與分歌結果。沒有明確段落標籤時，會依原文空白分節編為主歌；可在原始歌詞中修改。', ...document.warnings].join(' ');
                    fileWarnings.hidden = false;
                } else if (/\.pptx?$/i.test(file.name)) {
                    const slides = /\.ppt$/i.test(file.name)
                        ? await PptLyricImporter.parsePptFile(file)
                        : await PptxLyricImporter.parsePptxFile(file);
                    detectedSongs = PptxLyricImporter.detectSongs(slides).map(song => ({
                        ...song,
                        preview: song.contentSlides.flatMap(slide => slide.lines).slice(0, 2).join('\n'),
                        sourceDescription: `投影片 ${song.startSlide}–${song.endSlide}`,
                        result: SlideSections.consolidateSlides(song.contentSlides)
                    }));
                    source = `${slides.length} 張文字投影片`;
                    fileWarnings.textContent = '已排除母片、備註與頁碼欄位。分歌與段落名稱為自動判斷，匯入後請核對；圖片歌詞目前不支援。';
                    fileWarnings.hidden = false;
                } else {
                    throw new Error('請選擇 .ppt、.pptx 或 .docx 檔案。舊版 .doc 請先另存為 DOCX。');
                }
                if (!detectedSongs.length) throw new Error('找不到可匯入的歌詞。');
                renderSongChoices();
                setPptStatus(`已從 ${source} 辨識到 ${detectedSongs.length} 首歌，請選擇要匯入的歌曲。`);
            } catch (error) {
                detectedSongs = [];
                originalDocumentText = '';
                fileWarnings.hidden = true;
                setPptStatus(error.message || '無法解析這份歌詞檔案。', true);
            } finally {
                isFileParsing = false;
                pptDropZone.classList.remove('is-loading');
                pptDropZone.removeAttribute('aria-busy');
                pptInput.disabled = false;
                pptDropText.textContent = `已選擇：${file.name}（可再拖入另一份 PPT／PPTX／DOCX）`;
            }
        }

        function importDetectedSong(index) {
            const song = detectedSongs[index];
            if (!song) return;

            importLyrics(song.result.text, `已匯入${songOrdinal(index)}：整理為 ${song.result.sections.length} 個段落。`);
        }

        function importLyrics(text, message) {
            const inputEl = document.getElementById('inputLyrics');
            if (inputEl.value.trim() && !confirm('這會取代目前的原始歌詞，確定要匯入嗎？匯入後可以復原。')) return;
            applyInputChange(text);
            setPptStatus(message);
            inputEl.scrollIntoView({ block: 'center' });
        }

        function importAllSongs() {
            if (!detectedSongs.length) return;
            const text = detectedSongs.map((song, index) => `${song.title || songOrdinal(index)}\n\n${song.result.text}`).join('\n\n\n');
            importLyrics(text, `已匯入全部 ${detectedSongs.length} 首歌，以歌名分隔；複製時可依需要取用各首歌詞。`);
        }

        function importOriginalDocument() {
            if (originalDocumentText) importLyrics(originalDocumentText, '已匯入整份 Word 原文，保留歌名與原始分節，可直接修改。');
        }

        pptInput.addEventListener('change', event => {
            handleLyricFile(event.target.files[0]);
            event.target.value = '';
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            pptDropZone.addEventListener(eventName, event => {
                event.preventDefault();
                pptDropZone.classList.add('is-dragging');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            pptDropZone.addEventListener(eventName, event => {
                event.preventDefault();
                pptDropZone.classList.remove('is-dragging');
            });
        });

        pptDropZone.addEventListener('drop', event => {
            handleLyricFile(event.dataTransfer.files[0]);
        });

        function formatLyrics() {
            const inputLyrics = document.getElementById('inputLyrics').value;
            const charLimit = document.getElementById('charLimit').value;
            document.getElementById('outputLyrics').value = LyricFormatter.formatLyricsText(inputLyrics, charLimit);
        }

        function applyInputChange(nextValue) {
            const inputEl = document.getElementById('inputLyrics');
            if (nextValue === inputEl.value) return;

            inputHistory.push(inputEl.value);
            if (inputHistory.length > 20) inputHistory.shift();
            inputEl.value = nextValue;
            document.getElementById('undoBtn').disabled = false;
            formatLyrics();
        }

        function undoLastChange() {
            if (!inputHistory.length) return;
            document.getElementById('inputLyrics').value = inputHistory.pop();
            document.getElementById('undoBtn').disabled = inputHistory.length === 0;
            formatLyrics();
        }

        document.getElementById('inputLyrics').addEventListener('input', () => {
            inputHistory.length = 0;
            document.getElementById('undoBtn').disabled = true;
        });

        // 翻譯與其他工具
        function keepChineseOnly() {
            filterByLanguage('chinese', '中文');
        }

        function keepEnglishOnly() {
            filterByLanguage('english', '英文');
        }

        function filterByLanguage(language, label) {
            const inputEl = document.getElementById('inputLyrics');
            const result = LyricFormatter.filterLyricsByLanguage(inputEl.value, language);
            if (!result.removedLines.length) {
                alert(`沒有找到可移除的非${label}行。中英混合或無法判定的行會保留。`);
                return;
            }

            const message = `將移除 ${result.removedLines.length} 行明確的非${label}內容。\n中英混合或無法判定的 ${result.ambiguousCount} 行會保留，操作後也可以復原。\n\n確定繼續嗎？`;
            if (confirm(message)) applyInputChange(result.text);
        }

        function keepOddLines() {
            const inputEl = document.getElementById('inputLyrics');
            const result = LyricFormatter.keepOddContentLines(inputEl.value);
            if (!result.removedLines.length) {
                alert('沒有找到可移除的雙數內容行。');
                return;
            }

            const message = `將在每個段落內移除 ${result.removedLines.length} 個雙數內容行，段落標籤與空白行會保留。\n操作後可以按「復原上一步」。\n\n確定繼續嗎？`;
            if (confirm(message)) applyInputChange(result.text);
        }

        function replaceText(from, to) {
            const outputEl = document.getElementById('outputLyrics');
            if(!outputEl.value) formatLyrics();
            outputEl.value = outputEl.value.split(from).join(to);
        }

        function clearAll() {
            if(confirm('確定要清空所有內容嗎？')) {
                applyInputChange('');
            }
        }

        async function copyToClipboard() {
            const outputText = document.getElementById('outputLyrics');
            const btn = document.getElementById('copyBtn');
            const originalText = btn.innerHTML;
            
            if (!outputText.value.trim()) {
                alert("沒有內容可以複製喔！請先輸入歌詞並格式化。");
                return;
            }

            try {
                await navigator.clipboard.writeText(outputText.value);
                btn.innerHTML = "✅ 已複製！";
                btn.style.backgroundColor = "#059669"; // Emerald 600
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.backgroundColor = "";
                }, 2000);
            } catch (err) { alert('複製失敗，請手動複製。'); }
        }
    </script>
</body>
</html>
